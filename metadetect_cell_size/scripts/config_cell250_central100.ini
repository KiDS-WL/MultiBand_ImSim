# Configuration file for the metadetect cell-size test
#   for MultiBand_ImSim v1.3.0
#
# Re-measures the collaborator's grid images (seeing 0.73") with a different
#   metadetect cell_size / central_size. Everything else matches the run that
#   produced them, cell_size = 250 and central_size = 150:
#       /sdf/home/j/jlkitt/software/MultiBand_ImSim/test_scripts/grid/config_meta_073.ini
#
# Only task 6_2 is run, so only the sections it reads are kept.
# The six config_cell*_central*.ini files differ ONLY in cell_size and central_size.


################################## Paths ################################################
[Paths]

config_dir =            /sdf/home/l/liss/Projects/MultiBand_ImSim/config
                                               # metadetect_config.json here is identical to the collaborator's
out_dir =               /sdf/data/kipac/u/liss/ImSim/output/test_dev/jamar_seeing_073
                                               # <out_dir>/<runTag>/images links to the collaborator's images
tmp_dir =               /sdf/data/kipac/u/liss/ImSim/output/test_dev/jamar_seeing_073
cata_folder_names =     input, SExtractor, CrossMatch_cell${metadetect:cell_size}_central${metadetect:central_size}, photometry, photo_z, shapes_cell${metadetect:cell_size}_central${metadetect:central_size}, combined_cell${metadetect:cell_size}_central${metadetect:central_size}
                                               # folder names follow the [metadetect] values,
                                               #    so the six set-ups write to separate folders


################################## NoiseInfo ##############################################
[NoiseInfo]

cata_file =             /sdf/home/l/liss/Projects/MultiBand_ImSim/noise_info/Euclid_Q1_median_LSST10yr_repeated100.csv
                                               # copy of the collaborator's test_noise_info file
                                               # task 6_2 takes the tile labels from it
file4varChips =
psf_PixelIma_dir =
label_basename =        label
noise_basenames =       rms
psf_basenames_moffat =  InputSeeing, InputBeta, seeing_e1, seeing_e2
psf_basenames_airy =    lam, diam, obscuration, psf_e1, psf_e2
id_basenames =          chip_id, expo_id
psf_type_list =         Moffat


################################## ImSim ###################################################
[ImSim]
# as used to simulate the images, task 6_2 takes the bands, N_tiles and rotations from here

survey =                simple_0.5sqdeg
detection_band =        LSST_r
band_list =             LSST_r
pixel_scale_list =      0.2
image_type_list =       simple
image_chips =           False
image_PSF =             True
image_PSF_size =        48
image_noise =           True
casual_mag =            27
casual_band =           LSST_r
casual_Nbins =          20
casual_FracSeedGal =    0.01
N_tiles =               100
gal_rotation_angles =   0, 90
PSF_map =               False
mag_zero =              30
simple_area =           False
simple_cut =            True
simple_camera =         True
shear_positions =       True


################################## MeasureShape #################################################
[MeasureShape]

method =                metadetect
detection_band =        LSST_r
band_list =             LSST_r
image_label_list =      original


[metadetect]

same_PSF =              True
config_files =          metadetect_config.json
pixel_scale_list =      0.2
cell_size =             250                    # the cell size for metadetection
                                               #    should be even number
central_size =          100                    # the central size for metadetection
                                               #    should be even number and smaller than cell size
save_Ncells =           0
psf_image =             centred
trim_position =         noshear
cross_match =           False                  # not needed: the shear bias only uses the shape catalogues
                                               #    and it would need catalogues/input, which is not linked
